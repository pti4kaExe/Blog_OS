          type: array
          items: { $ref: '#/components/schemas/GoldenLabel' }
        platform:
          oneOf:
            - $ref: '#/components/schemas/Platform'
            - type: 'null'
    Golden:
      type: object
      additionalProperties: false
      required: [id, text, labels, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        text: { type: string }
        labels:
          type: array
          items: { $ref: '#/components/schemas/GoldenLabel' }
        platform:
          oneOf:
            - $ref: '#/components/schemas/Platform'
            - type: 'null'
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    GoldenList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Golden' }
        next_cursor:
          oneOf:
            - type: string
            - type: 'null'
    EvalRunInput:
      type: object
      additionalProperties: false
      properties:
        use_llm: { type: boolean, default: false }
        platform:
          oneOf:
            - $ref: '#/components/schemas/Platform'
            - type: 'null'
    EvalSummary:
      type: object
      required: [goldens, precision, recall, matched, missed, false_positive]
      properties:
        goldens: { type: integer, minimum: 0 }
        precision: { type: number, minimum: 0, maximum: 1 }
        recall: { type: number, minimum: 0, maximum: 1 }
        matched: { type: integer, minimum: 0 }
        missed: { type: integer, minimum: 0 }
        false_positive: { type: integer, minimum: 0 }
    EvalResult:
      type: object
      required: [golden_id, precision, recall]
      properties:
        golden_id: { $ref: '#/components/schemas/Id' }
        precision: { type: number }
        recall: { type: number }
        matched:
          type: array
          items:
            type: object
            additionalProperties: true
        missed:
          type: array
          items:
            type: object
            additionalProperties: true
        false_positive:
          type: array
          items:
            type: object
            additionalProperties: true
    EvalRunResponse:
      type: object
      required: [generation_run_id, summary, results]
      properties:
        generation_run_id: { $ref: '#/components/schemas/Id' }
        summary: { $ref: '#/components/schemas/EvalSummary' }
        results:
          type: array
          items: { $ref: '#/components/schemas/EvalResult' }
    EvalRunSummary:
      type: object
      additionalProperties: true
      description: Сводка по прогону Evals (без фильтра `generation_run_id`)
      properties:
        generation_run_id: { $ref: '#/components/schemas/Id' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        goldens: { type: integer, minimum: 0 }
        precision: { type: number }
        recall: { type: number }
    EvalRunsList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EvalRunSummary' }
        next_cursor:
          oneOf:
            - type: string
            - type: 'null'
