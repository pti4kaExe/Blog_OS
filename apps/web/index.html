<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Иконка сайта: SVG — для современных браузеров, PNG и ICO — для Safari,
         закладок и установки на телефон. Отдельные файлы нужны потому, что часть
         браузеров не умеет SVG-иконки вовсе. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Превью ссылки: Telegram, Slack и соцсети берут картинку отсюда.
         Адрес абсолютный — краулеры не открывают относительные пути. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BlogOS" />
    <meta property="og:title" content="BlogOS — пост в вашем стиле, проверенный до публикации" />
    <meta property="og:description" content="Собирает пост из сырых заметок в авторском стиле и проверяет черновик на клише, логические ошибки и отклонения от Tone of Voice." />
    <meta property="og:url" content="https://pti4kaexe.github.io/Blog_OS/" />
    <meta property="og:image" content="https://pti4kaexe.github.io/Blog_OS/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BlogOS — пост в вашем стиле" />
    <meta name="twitter:description" content="Пост из сырых заметок в авторском стиле, проверенный до публикации." />
    <meta name="twitter:image" content="https://pti4kaexe.github.io/Blog_OS/og-image.png" />

    <!-- Гарнитуры продукта. Lora — заголовки и крупные числа: редакторская
         антиква с полной кириллицей, то, что отличает рабочий инструмент
         автора от типовой SaaS-панели. Inter — интерфейсный текст, он не
         должен спорить с антиквой. Системный стек остаётся запасным: без
         сети шрифты не загрузятся, и интерфейс обязан остаться читаемым. -->
    <link rel="preconnect" href="https://blogos-api-shlm.onrender.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Шрифты не блокируют первый рендер: системный стек уже прописан в CSS -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" /></noscript>
    <!-- Цвет строки браузера на мобильных. Должен совпадать с
         --surface-base из styles/tokens.css: иначе рамка браузера и
         экран приложения выглядят из разных продуктов. -->
    <meta name="theme-color" content="#16161A" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <title>BlogOS — пост в вашем стиле, проверенный до публикации</title>
    <meta name="description" content="BlogOS: собирает пост из сырых заметок в авторском стиле и проверяет черновик на клише, логические ошибки и отклонения от Tone of Voice." />
    <script>
      /* Тема до первого кадра: иначе светлая тема моргнёт тёмным.
         Держать в синхронном inline-скрипте — он выполняется до отрисовки. */
      (function () {
        try {
          var stored = localStorage.getItem('blogos.theme.v1');
          var pref = ['system', 'light', 'dark'].indexOf(stored) >= 0 ? stored : 'system';
          var resolved = pref === 'system'
            ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
            : pref;
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding:24px;font-family:system-ui,sans-serif;line-height:1.5">
        <h1>BlogOS</h1>
        <p>Для работы нужен JavaScript: приложение считает проверку текста прямо в браузере.</p>
        <p>Включите JavaScript и обновите страницу.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
