<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Гарнитуры продукта. Lora — заголовки и крупные числа: редакторская
         антиква с полной кириллицей, то, что отличает рабочий инструмент
         автора от типовой SaaS-панели. Inter — интерфейсный текст, он не
         должен спорить с антиквой. Системный стек остаётся запасным: без
         сети шрифты не загрузятся, и интерфейс обязан остаться читаемым. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap"
    />
    <meta name="theme-color" content="#1a1512" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f0e8" media="(prefers-color-scheme: light)" />
    <title>BlogOS — пост в вашем стиле, проверенный до публикации</title>
    <meta name="description" content="BlogOS: собирает пост из сырых заметок в авторском стиле и проверяет черновик на клише, логические ошибки и отклонения от Tone of Voice." />
    <script>
      /* Тема до первого кадра: иначе светлая тема моргнёт тёмным.
         Держать в синхронном inline-скрипте — он выполняется до отрисовки. */
      (function () {
        try {
          var stored = localStorage.getItem('blogos.theme.v1');
          var pref = ['system', 'light', 'dark'].indexOf(stored) >= 0 ? stored : 'system';
          var resolved = pref === 'system'
            ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
            : pref;
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
