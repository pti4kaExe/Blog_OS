name: Keep API warm

# Держит бесплатный инстанс Render «тёплым», чтобы у посетителей не было
# 30–60 секунд ожидания холодного старта.
#
# Как это работает: Render free засыпает после ~15 минут без входящих запросов.
# Расписание ниже пингует лёгкий /health?light=1 раз в 10 минут: процесс
# просыпается и остаётся живым. Лёгкий режим не обращается к базе — у Neon свой
# лимит вычислений, и прогрев не должен его расходовать.
#
# Стоимость: ни GitHub, ни Render за это не берут денег сверх бесплатного
# тарифа. Render free даёт 750 часов инстанса в месяц, круглосуточная работа —
# ~730 часов, поэтому неделя с частыми деплоями может приблизить к лимиту:
# если это станет проблемой, сузьте окно по времени (см. docs/RUNBOOK.md).
on:
  schedule:
    # Каждые 10 минут. Гонки нет: Render засыпает после 15 минут тишины.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Пинговать лёгкий /health
        run: |
          set -u
          url='https://blogos-api-shlm.onrender.com/health?light=1'
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$url" || true)
            echo "попытка $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "сервер тёплый"
              exit 0
            fi
            sleep 20
          done
          echo "сервер не ответил — проверьте Render"
          exit 1
