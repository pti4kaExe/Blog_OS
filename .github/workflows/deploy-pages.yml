name: Deploy web client to GitHub Pages

# Собирает apps/web и публикует статику на GitHub Pages.
#
# Бэкенда на Pages нет: это статический хостинг. Адрес облачного API приходит
# из переменной репозитория VITE_API_URL (Settings → Secrets and variables →
# Actions → Variables). Пока переменная не задана, облачный режим клиента
# показывает «сервер недоступен», а локальный работает полностью в браузере.
on:
  push:
    branches: [main, front/pipeline-screen]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: npm
      - run: npm ci
      - run: npm run build:web
        env:
          # Подпуть GitHub Pages: сайт публикуется по /<репозиторий>/.
          VITE_BASE: /Blog_OS/
          # Адрес API задаётся переменной репозитория, а не в коде:
          # меняется в настройках GitHub без правки файлов.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
