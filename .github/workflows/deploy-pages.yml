name: Deploy web client to GitHub Pages

# Собирает apps/web и публикует статику на GitHub Pages с ветки
# front/pipeline-screen — main этот workflow не трогает и не требует.
#
# Бэкенда на Pages нет: это статический хостинг. Облачный режим клиента
# будет показывать «сервер недоступен» (VITE_API_URL не задан — адрес
# облачного API появится, когда он будет где-то развёрнут), локальный
# режим работает полностью в браузере без сервера.
on:
  push:
    branches: [front/pipeline-screen]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: npm
      - run: npm ci
      - run: npm run build:web
        env:
          VITE_BASE: /Blog_OS/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
